
const $ = (sel, ctx=document) => ctx.querySelector(sel);
const $$ = (sel, ctx=document) => [...ctx.querySelectorAll(sel)];

const header = $('.header');
const menuBtn = $('.menu-btn');
const nav = $('.nav');

addEventListener('scroll', () => header?.classList.toggle('is-scrolled', scrollY > 20));
menuBtn?.addEventListener('click', () => {
  nav?.classList.toggle('is-open');
  menuBtn.setAttribute('aria-expanded', nav?.classList.contains('is-open') ? 'true' : 'false');
});
$$('.nav a').forEach(a => a.addEventListener('click', () => nav?.classList.remove('is-open')));

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('is-visible');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: .12 });
$$('.reveal').forEach(el => observer.observe(el));

$$('[data-carousel]').forEach(carousel => {
  const wrap = carousel.closest('.carousel-wrap');
  $('[data-prev]', wrap)?.addEventListener('click', () => carousel.scrollBy({left: -carousel.clientWidth * .78, behavior:'smooth'}));
  $('[data-next]', wrap)?.addEventListener('click', () => carousel.scrollBy({left: carousel.clientWidth * .78, behavior:'smooth'}));
});

const audioPath = document.body.dataset.audio;
const audio = audioPath ? new Audio(audioPath) : null;
if (audio) {
  audio.loop = true;
  audio.volume = Number(localStorage.getItem('ludo-volume') ?? .45);
}
const soundBtn = $('[data-sound-toggle]');
const volume = $('[data-volume]');
if (volume && audio) volume.value = audio.volume;

function paintSound() {
  if (!soundBtn) return;
  const off = !audio || audio.paused || audio.muted || audio.volume === 0;
  soundBtn.textContent = off ? '🔇' : '🔊';
  soundBtn.setAttribute('aria-label', off ? 'Ativar som' : 'Silenciar som');
}
soundBtn?.addEventListener('click', async () => {
  if (!audio) return;
  if (audio.paused) {
    try { await audio.play(); } catch (e) {}
  } else {
    audio.muted = !audio.muted;
  }
  paintSound();
});
volume?.addEventListener('input', e => {
  if (!audio) return;
  audio.volume = Number(e.target.value);
  audio.muted = false;
  localStorage.setItem('ludo-volume', audio.volume);
  paintSound();
});

const overlay = $('.entry-overlay');
async function enterExperience(withSound) {
  if (withSound && audio) {
    try { await audio.play(); } catch(e) {}
  }
  overlay?.classList.add('is-hidden');
  sessionStorage.setItem('ludo-entered', '1');
  paintSound();
}
$('[data-enter-sound]')?.addEventListener('click', () => enterExperience(true));
$('[data-enter-muted]')?.addEventListener('click', () => enterExperience(false));
if (sessionStorage.getItem('ludo-entered') === '1') overlay?.classList.add('is-hidden');

const GALLERY_LINKS = {
  // EXEMPLO:
  // "ANTONELA2026": "https://sua-galeria-protegida.com/antonela"
};

$$('[data-access-form]').forEach(form => {
  const input = $('input', form);
  const status = $('.form-status', form);
  form.addEventListener('submit', e => {
    e.preventDefault();
    const code = (input.value || '').trim().toUpperCase();
    if (!code) {
      status.textContent = 'Digite o código entregue pela equipe LUDO.';
      return;
    }
    const url = GALLERY_LINKS[code];
    if (url) {
      status.textContent = 'Galeria encontrada. Abrindo acesso seguro...';
      setTimeout(() => location.href = url, 450);
    } else {
      status.textContent = 'Código ainda não cadastrado ou digitado incorretamente.';
    }
  });
});

$$('[data-year]').forEach(el => el.textContent = new Date().getFullYear());
paintSound();
