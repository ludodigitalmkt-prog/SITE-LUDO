
:root{
  --bg:#08080b;
  --surface:#101017;
  --surface-2:#181821;
  --text:#f6f4ff;
  --muted:#a6a4b2;
  --line:rgba(255,255,255,.12);
  --accent:#9d5cff;
  --accent-2:#38e4ff;
  --accent-rgb:157,92,255;
  --accent2-rgb:56,228,255;
  --radius:26px;
  --shadow:0 30px 80px rgba(0,0,0,.42);
  --max:1240px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(circle at 10% 10%,rgba(var(--accent-rgb),.16),transparent 34%),
    radial-gradient(circle at 90% 15%,rgba(var(--accent2-rgb),.12),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.5;
  overflow-x:hidden;
}
body[data-theme="infantil"]{
  --bg:#0b0714;--surface:#170f28;--surface-2:#21123c;
  --accent:#ff5bbd;--accent-2:#54e5ff;--accent-rgb:255,91,189;--accent2-rgb:84,229,255;
}
body[data-theme="bebe"]{
  --bg:#0d0b13;--surface:#191520;--surface-2:#251e2c;
  --accent:#e9a8ff;--accent-2:#9fe7ff;--accent-rgb:233,168,255;--accent2-rgb:159,231,255;
}
body[data-theme="casamento"]{
  --bg:#0d0c0b;--surface:#171512;--surface-2:#221f1a;
  --accent:#d4b77c;--accent-2:#f4e6bd;--accent-rgb:212,183,124;--accent2-rgb:244,230,189;
}
body[data-theme="formatura"]{
  --bg:#070b14;--surface:#0d1626;--surface-2:#112039;
  --accent:#5ea8ff;--accent-2:#ffd36b;--accent-rgb:94,168,255;--accent2-rgb:255,211,107;
}
body[data-theme="palestras"]{
  --bg:#05090d;--surface:#0a131b;--surface-2:#0e1c28;
  --accent:#33d1ff;--accent-2:#6b7cff;--accent-rgb:51,209,255;--accent2-rgb:107,124,255;
}
body[data-theme="festas"]{
  --bg:#060307;--surface:#140817;--surface-2:#220b28;
  --accent:#ff2fc8;--accent-2:#875dff;--accent-rgb:255,47,200;--accent2-rgb:135,93,255;
}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
button,input{font:inherit}
button{color:inherit}
.container{width:min(calc(100% - 36px),var(--max));margin-inline:auto}
.section{padding:110px 0;position:relative}
.eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  text-transform:uppercase;letter-spacing:.18em;font-size:.75rem;font-weight:800;color:var(--accent-2)
}
.eyebrow::before{content:"";width:34px;height:1px;background:currentColor}
.section-title{
  font-size:clamp(2.3rem,5.6vw,5.6rem);line-height:.95;letter-spacing:-.055em;
  margin:20px 0 24px;max-width:880px
}
.section-copy{max-width:670px;color:var(--muted);font-size:clamp(1rem,1.4vw,1.2rem)}
.glow-text{
  background:linear-gradient(100deg,#fff,var(--accent-2),var(--accent),#fff);
  background-size:220% auto;color:transparent;background-clip:text;-webkit-background-clip:text;
  animation:textFlow 7s linear infinite
}
@keyframes textFlow{to{background-position:220% center}}
.header{
  position:fixed;inset:0 0 auto;z-index:60;padding:18px 0;
  transition:background .25s,backdrop-filter .25s,border-color .25s
}
.header.is-scrolled{background:rgba(7,7,11,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.08em}
.brand-mark{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 10px 30px rgba(var(--accent-rgb),.3);
  color:#05050a;font-weight:1000
}
.nav{display:flex;align-items:center;gap:26px;font-size:.92rem}
.nav a{color:#dad8e4;transition:.2s}
.nav a:hover{color:white}
.menu-btn{display:none;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:14px;width:46px;height:46px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:52px;padding:0 22px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);font-weight:800;cursor:pointer;transition:.25s
}
.btn:hover{transform:translateY(-3px);background:rgba(255,255,255,.1)}
.btn-primary{
  color:#07070b;border:0;background:linear-gradient(115deg,var(--accent-2),var(--accent));
  box-shadow:0 14px 34px rgba(var(--accent-rgb),.23)
}
.btn-ghost{backdrop-filter:blur(12px)}
.hero{min-height:100svh;display:grid;align-items:end;position:relative;overflow:hidden}
.hero-media{position:absolute;inset:0;z-index:-3}
.hero-media video,.hero-media img{width:100%;height:100%;object-fit:cover}
.hero-media::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(5,5,9,.28),rgba(5,5,9,.12) 35%,rgba(5,5,9,.92) 92%),
             linear-gradient(90deg,rgba(5,5,9,.66),transparent 66%)
}
.hero-grid{
  position:absolute;inset:0;z-index:-1;opacity:.18;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:72px 72px;
  mask-image:linear-gradient(to bottom,black,transparent 82%)
}
.hero-content{padding:160px 0 70px}
.hero-kicker{display:flex;align-items:center;gap:12px;color:#ddd9e8;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase}
.hero-kicker span{width:42px;height:1px;background:var(--accent-2)}
.hero h1{
  margin:22px 0 22px;font-size:clamp(4.1rem,11vw,10rem);line-height:.79;letter-spacing:-.07em;
  max-width:1050px;text-transform:uppercase
}
.hero p{max-width:640px;color:#d7d4df;font-size:clamp(1.03rem,1.6vw,1.3rem)}
.hero-actions{display:flex;flex-wrap:wrap;gap:13px;margin-top:34px}
.hero-meta{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  margin-top:64px;border-top:1px solid var(--line);padding-top:24px;max-width:780px
}
.hero-meta strong{font-size:1.35rem;display:block}.hero-meta span{color:var(--muted);font-size:.85rem}
.marquee{overflow:hidden;border-block:1px solid var(--line);background:rgba(255,255,255,.025)}
.marquee-track{display:flex;width:max-content;animation:marquee 26s linear infinite;padding:17px 0}
.marquee span{font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:#d6d3df;white-space:nowrap}
.marquee i{font-style:normal;color:var(--accent-2);margin:0 26px}
@keyframes marquee{to{transform:translateX(-50%)}}
.categories{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-top:56px}
.category-card{
  position:relative;min-height:480px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);
  isolation:isolate;box-shadow:var(--shadow)
}
.category-card:nth-child(1),.category-card:nth-child(4){grid-column:span 7}
.category-card:nth-child(2),.category-card:nth-child(3){grid-column:span 5}
.category-card:nth-child(5),.category-card:nth-child(6){grid-column:span 6}
.category-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .7s}
.category-card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(5,5,8,.95),transparent 62%)}
.category-card:hover img{transform:scale(1.06)}
.category-content{position:absolute;inset:auto 26px 26px}
.category-number{color:var(--accent-2);font-size:.78rem;letter-spacing:.18em;font-weight:900}
.category-card h3{margin:8px 0 4px;font-size:clamp(2rem,3.2vw,3.6rem);line-height:.95;letter-spacing:-.04em}
.category-card p{margin:0;color:#d6d3dc}
.video-shell{
  margin-top:54px;position:relative;border-radius:34px;overflow:hidden;border:1px solid var(--line);
  background:#020204;box-shadow:var(--shadow);aspect-ratio:16/8.4
}
.video-shell video{width:100%;height:100%;object-fit:cover}
.video-badge{
  position:absolute;left:22px;bottom:22px;padding:12px 16px;border-radius:999px;
  background:rgba(0,0,0,.58);border:1px solid var(--line);backdrop-filter:blur(14px);font-size:.8rem
}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:54px}
.stat{padding:28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02))}
.stat strong{font-size:clamp(2rem,4vw,4.1rem);line-height:1}.stat span{display:block;color:var(--muted);margin-top:10px}
.carousel-wrap{position:relative;margin-top:50px}
.carousel{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(320px,43vw);gap:18px;
  overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:10px
}
.carousel::-webkit-scrollbar{display:none}
.shot{scroll-snap-align:start;position:relative;aspect-ratio:4/5;border-radius:28px;overflow:hidden;border:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;transition:.65s}
.shot:hover img{transform:scale(1.06)}
.shot::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.74),transparent 55%)}
.shot-caption{position:absolute;z-index:2;left:22px;bottom:20px}
.shot-caption b{display:block;font-size:1.25rem}.shot-caption span{color:#d6d2dc;font-size:.9rem}
.carousel-controls{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.icon-btn{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.05);cursor:pointer}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:54px}
.service{
  min-height:280px;padding:28px;border-radius:28px;border:1px solid var(--line);
  background:linear-gradient(145deg,rgba(var(--accent-rgb),.14),rgba(255,255,255,.02));position:relative;overflow:hidden
}
.service::before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(var(--accent2-rgb),.14);filter:blur(30px);right:-80px;top:-70px}
.service small{color:var(--accent-2);font-weight:900;letter-spacing:.14em}
.service h3{font-size:1.65rem;margin:70px 0 10px}.service p{color:var(--muted)}
.access-panel{
  display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center;
  padding:clamp(28px,5vw,64px);border-radius:38px;border:1px solid var(--line);
  background:
    linear-gradient(135deg,rgba(var(--accent-rgb),.22),rgba(var(--accent2-rgb),.08)),
    var(--surface);
  box-shadow:var(--shadow);position:relative;overflow:hidden
}
.access-panel::after{content:"";position:absolute;width:360px;height:360px;border:1px solid rgba(255,255,255,.15);border-radius:50%;right:-160px;top:-130px}
.access-panel h2{font-size:clamp(2.6rem,6vw,6rem);line-height:.9;letter-spacing:-.055em;margin:0 0 22px}
.access-panel p{color:#d5d1dd;max-width:600px}
.access-form{position:relative;z-index:2;padding:24px;border-radius:24px;background:rgba(4,4,8,.42);backdrop-filter:blur(20px);border:1px solid var(--line)}
.input-wrap{display:flex;gap:10px;margin-top:12px}
.input-wrap input{
  width:100%;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);
  color:white;padding:0 18px;outline:none;text-transform:uppercase
}
.input-wrap input:focus{border-color:var(--accent-2);box-shadow:0 0 0 4px rgba(var(--accent2-rgb),.1)}
.form-note{font-size:.78rem;color:var(--muted);margin-top:12px}
.form-status{font-size:.86rem;min-height:22px;margin-top:12px}
.footer{padding:50px 0 30px;border-top:1px solid var(--line)}
.footer-grid{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:36px}
.footer h4{margin:0 0 14px}.footer a,.footer p{color:var(--muted)}
.footer-links{display:grid;gap:9px}.footer-bottom{border-top:1px solid var(--line);margin-top:34px;padding-top:20px;color:var(--muted);font-size:.86rem}
.sound-panel{
  position:fixed;z-index:70;right:18px;bottom:18px;display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:999px;background:rgba(8,8,12,.72);backdrop-filter:blur(18px);border:1px solid var(--line)
}
.sound-panel button{border:0;background:transparent;cursor:pointer}
.sound-panel input{width:80px;accent-color:var(--accent)}
.entry-overlay{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:22px;
  background:rgba(3,3,6,.9);backdrop-filter:blur(22px);transition:.55s
}
.entry-overlay.is-hidden{opacity:0;visibility:hidden}
.entry-card{text-align:center;max-width:600px}
.entry-card .brand-mark{margin:0 auto 22px}
.entry-card h2{font-size:clamp(3rem,8vw,6rem);line-height:.87;letter-spacing:-.06em;margin:0 0 18px}
.entry-card p{color:var(--muted);margin-bottom:28px}
.entry-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}
.reveal.is-visible{opacity:1;transform:none}
.back-link{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;color:#e2dfea}
.category-hero h1{font-size:clamp(4rem,12vw,10.5rem);max-width:1200px}
.category-hero .hero-content{padding-bottom:62px}
@media (max-width:900px){
  .nav{
    position:fixed;top:78px;left:18px;right:18px;display:none;flex-direction:column;align-items:stretch;
    padding:20px;border:1px solid var(--line);border-radius:24px;background:rgba(8,8,12,.96);backdrop-filter:blur(20px)
  }
  .nav.is-open{display:flex}.menu-btn{display:block}
  .header .btn-primary{display:none}
  .category-card,.category-card:nth-child(n){grid-column:span 12;min-height:440px}
  .services{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .access-panel{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr 1fr}.footer-grid>:first-child{grid-column:1/-1}
}
@media (max-width:620px){
  .container{width:min(calc(100% - 24px),var(--max))}
  .section{padding:82px 0}
  .hero-content{padding:140px 0 42px}
  .hero h1{font-size:clamp(3.55rem,19vw,6rem)}
  .hero-meta{grid-template-columns:1fr 1fr}.hero-meta>:last-child{grid-column:1/-1}
  .video-shell{aspect-ratio:9/14}
  .carousel{grid-auto-columns:84vw}
  .stats{grid-template-columns:1fr 1fr}.stat{padding:20px}
  .footer-grid{grid-template-columns:1fr}
  .sound-panel input{display:none}
  .input-wrap{flex-direction:column}.input-wrap .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
